<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Currículum Vitae de Giomar Huacho - Sistemas Microinformáticos y Redes.">
    <title>Currículum | Giomar Huacho</title>
    
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /*  BASE Y FONDO CIAN IDÉNTICO AL INDEX  */
        html { 
            background-color: #04121c !important; 
            scroll-behavior: smooth;
        }
        body { 
            animation: none !important; 
            background-color: transparent !important; 
        }
        main { 
            animation: pageFadeIn 0.8s ease-out forwards; 
        }
        
        .ripple-background {
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important;
            width: 100vw !important; 
            height: 100vh !important; 
            z-index: -2 !important;
            background-image: url('FONDO.jpg') !important;
            background-size: cover !important; 
            background-position: center center !important; 
            pointer-events: none !important; 
        }

        /* =========================================================
           1. NAVBAR CON LOGO GSC Y ANIMACIÓN IGUAL AL INDEX
           ========================================================= */
        .logo {
            color: #ffffff !important;
            text-shadow: 
                0 0 10px rgba(0, 255, 255, 0.85),
                0 0 20px rgba(0, 215, 255, 0.5) !important;
            transition: transform 0.3s ease, text-shadow 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.05);
            text-shadow: 
                0 0 14px #00ffff,
                0 0 28px #00d9ff !important;
        }

        .nav ul li a {
            position: relative;
            padding-bottom: 6px;
            transition: color 0.3s ease, text-shadow 0.3s ease !important;
        }

        .nav ul li a::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -2px;
            width: 100%;
            height: 2.5px;
            background: linear-gradient(90deg, transparent, #00ffff, #7ef9ff, #00ffff, transparent);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.85);
            border-radius: 4px;
            transform: translateX(-50%) scaleX(0);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .nav ul li a:hover::after,
        .nav ul li a.active::after {
            transform: translateX(-50%) scaleX(1);
        }

        .nav ul li a:hover {
            color: #00ffff !important;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.55);
        }

        /* =========================================================
           2. TÍTULO CON LA MISMA LETRA, NEÓN CIAN Y HOVER DE INDEX
           ========================================================= */
        .cv-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 35px;
            animation: gentleFloat 4.5s ease-in-out infinite alternate;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-7px); }
        }

        .cv-header .title-main {
            font-family: 'Pacifico', cursive !important;
            font-weight: 400 !important;
            font-size: clamp(3rem, 5.5vw, 4.5rem) !important;
            color: #ffffff !important;
            -webkit-text-stroke: 0px transparent !important;
            text-align: center !important;
            margin: 0 auto !important;
            /* Contorno neón cian limpio por fuera sin cortar las letras */
            text-shadow: 
                0 0 6px #00ffff,
                0 0 14px rgba(0, 255, 255, 0.9),
                0 0 28px rgba(0, 230, 255, 0.75),
                0 0 50px rgba(0, 195, 255, 0.5),
                0 4px 12px rgba(0, 0, 0, 0.30) !important;
            filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.45));
            transition: transform 0.35s ease, text-shadow 0.35s ease, filter 0.35s ease;
        }

        /* Animación al pasar el cursor idéntica a tu index */
        .cv-header .title-main:hover {
            transform: scale(1.03);
            text-shadow: 
                0 0 10px #00ffff,
                0 0 22px #00ffff,
                0 0 42px rgba(0, 225, 255, 0.9),
                0 0 70px rgba(0, 195, 255, 0.65) !important;
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.75));
        }

        .cv-header .subtitle-main {
            color: #ffffff !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            letter-spacing: 5px !important;
            padding-left: 5px !important;
            margin: 10px auto 0 auto !important;
            text-align: center !important;
            text-transform: uppercase;
            text-shadow: 
                0 0 8px rgba(0, 245, 255, 0.65),
                0 0 18px rgba(0, 210, 255, 0.35),
                0 2px 6px rgba(0, 0, 0, 0.4) !important;
        }

        /* =========================================================
           3. TARJETA DE CRISTAL CIAN TRANSPARENTE CON ANIMACIÓN HOVER
           ========================================================= */
        .cv-glass-card {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(6, 28, 42, 0.32) 50%,
                rgba(0, 215, 255, 0.08) 100%
            ) !important;
            backdrop-filter: blur(18px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(18px) saturate(140%) !important;
            border: 1px solid rgba(0, 255, 255, 0.28) !important;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(0, 255, 255, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 0.25) !important;
            border-radius: 24px !important;
            padding: 38px !important;
            max-width: 950px;
            width: 92%;
            text-align: center;
            margin-bottom: 60px;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease !important;
        }

        .cv-glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 255, 0.55) !important;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.55),
                0 0 35px rgba(0, 255, 255, 0.18),
                inset 0 1px 1px rgba(255, 255, 255, 0.35) !important;
        }

        /* Visor de la imagen de tu CV */
        .cv-image-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.35);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            margin-bottom: 32px;
        }
        .cv-image-box:hover {
            transform: translateY(-4px) scale(1.005);
            border-color: #00ffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 255, 255, 0.22);
        }
        .cv-image-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* =========================================================
           4. BOTÓN DE DESCARGA PDF TRANSPARENTE CON NEÓN CIAN
           ========================================================= */
        .btn-download-cv {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 14px 38px;
            border-radius: 999px;
            background: transparent !important;
            color: #00ffff !important;
            border: 1px solid rgba(0, 255, 255, 0.6) !important;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.55);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25), 0 0 15px rgba(0, 255, 255, 0.15);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .btn-download-cv i {
            color: #00ffff;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.7));
            transition: transform 0.3s ease;
        }

        .btn-download-cv:hover {
            background: rgba(0, 255, 255, 0.12) !important;
            border-color: #00ffff !important;
            color: #ffffff !important;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 0 25px rgba(0, 255, 255, 0.45);
        }

        .btn-download-cv:hover i {
            transform: translateY(-2px) scale(1.1);
        }

        /* =========================================================
           5. BOTÓN DE AGUA 100% TRANSPARENTE A LA DERECHA
           ========================================================= */
        .water-pill-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 2000;
            background: transparent !important;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            height: 36px;
            padding: 0 15px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .water-pill-btn:hover {
            background: rgba(0, 255, 255, 0.1) !important;
            border-color: #00ffff;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #00ffff;
            box-shadow: 0 0 8px #00ffff;
        }
        .water-pill-btn.off {
            opacity: 0.5;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .water-pill-btn.off .status-dot {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: none;
        }
    </style>
</head>
<body class="water-effect">

    <div class="ripple-background"></div>

    <!-- Botón transparente a la derecha para el agua -->
    <button id="toggle-water" class="water-pill-btn" title="Activar/Desactivar efecto agua">
        <span class="status-dot"></span>
        <span class="water-label">Agua</span>
    </button>

    <header class="navbar">
        <div class="navbar-content">
            <h1 class="logo">GSC</h1>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cv.html" class="active">Curriculum</a></li>
                    <li><a href="portafolio.html">Portafolio</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="cv-main-container" style="padding-top: 125px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;">
        
        <div class="cv-header reveal">
            <h1 class="title-main">Mi Currículum</h1>
            <p class="subtitle-main">VISUALIZA O DESCARGA MI PERFIL PROFESIONAL</p>
        </div>

        <div class="glass-box cv-glass-card reveal-scale">
            
            <!-- EL VISOR DE TU CV EN IMAGEN -->
            <div class="cv-image-box">
                <img src="CV_Giomar.jpg" alt="Currículum de Giomar Huacho">
            </div>

            <!-- BOTÓN DE DESCARGA PDF TRANSPARENTE CON LETRA CIAN -->
            <div class="btn-group" style="display: flex; justify-content: center;">
                <a href="CV_Giomar.pdf" download class="btn-download-cv">
                    <i class="fas fa-file-pdf"></i> Descargar CV en PDF
                </a>
            </div>
            
        </div>
    </main>

    <footer class="main-footer"><p>Esta Página Web fue creada con Visual Studio Code por Giomar Huacho</p></footer>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.ripples@0.6.3/dist/jquery.ripples.min.js"></script>
    <script>
        jQuery(document).ready(function() { 
            var water = jQuery('.ripple-background');
            var waterEnabled = localStorage.getItem('waterEffect') !== 'off';
            
            function initWater() {
                try { 
                    water.ripples({ resolution: 512, dropRadius: 20, perturbance: 0.04, interactive: false }); 
                } catch (e) { console.log(e); }
            }

            if (waterEnabled) {
                initWater();
            } else {
                jQuery('#toggle-water').addClass('off').find('.water-label').text('Off');
            }
            
            jQuery(window).on('resize', function() { 
                if (waterEnabled) {
                    try { water.ripples('updateSize'); } catch (e) {}
                }
            });

            jQuery('#toggle-water').on('click', function() {
                waterEnabled = !waterEnabled;
                if (!waterEnabled) {
                    localStorage.setItem('waterEffect', 'off');
                    try { water.ripples('destroy'); } catch(e) {}
                    jQuery(this).addClass('off').find('.water-label').text('Off');
                } else {
                    localStorage.setItem('waterEffect', 'on');
                    initWater();
                    jQuery(this).removeClass('off').find('.water-label').text('Agua');
                }
            });
            
            var isRippling = false;
            jQuery('body').on('mousemove mousedown', function(e) { 
                if (!waterEnabled) return;
                if (e.type === 'mousedown' && jQuery(e.target).closest('a, button, .btn-download-cv, .water-pill-btn').length) return;
                
                // ESCUDO
                if (jQuery(e.target).closest('.navbar, .glass-box, .cv-header, .main-footer, .water-pill-btn').length) return;
                
                if (!isRippling) {
                    isRippling = true;
                    requestAnimationFrame(function() {
                        var radius = (e.type === 'mousedown') ? 35 : 15;
                        var perturbance = (e.type === 'mousedown') ? 0.05 : 0.01;
                        water.ripples('drop', e.clientX, e.clientY, radius, perturbance);
                        isRippling = false;
                    });
                }
            });
            
            jQuery('.nav a').on('click', function(e) {
                if (jQuery(this).attr('target') === '_blank') return;
                if (jQuery(this).attr('download') !== undefined) return;
                if (jQuery(this).hasClass('active')) return;
                e.preventDefault(); 
                var targetUrl = jQuery(this).attr('href');
                jQuery('body').addClass('page-exit'); 
                setTimeout(function() { window.location.href = targetUrl; }, 300); 
            });
            
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) { 
                    if (entry.isIntersecting) entry.target.classList.add('active'); 
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.reveal, .reveal-left, .reveal-right, .reveal-scale').forEach(function(el) {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
